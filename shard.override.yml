# Ramène sur GitHub (commit retenu par shard.lock ; partiduo-* sur la branche
# de partiduo-dist, shards maison sur production) les
# dépendances que les dépôts déclarent en path: pour le développement local
# (DECISIONS D-003 de partiduo-app), et le fork aloli-crystal/marten que
# marten_auth déclare chez martenframework ; marten suit la branche
# production du fork : ses versions étiquetées antérieures à 0.7.0 déclarent
# i18n à une adresse GitHub disparue, ce qui fait échouer la résolution. Aucune source locale : le paquet
# se construit hors de l'arborescence de développement.
dependencies:
  partiduo:
    github: aloli-partiduo/partiduo-app
    branch: development
  partiduo-ui-bulma:
    github: aloli-partiduo/partiduo-ui-bulma
    branch: development
  partiduo-document:
    github: aloli-partiduo/partiduo-document
    branch: development
  partiduo-einvoicing:
    github: aloli-partiduo/partiduo-einvoicing
    branch: development
  marten:
    github: aloli-crystal/marten
    branch: production
  authn:
    github: aloli-crystal/authn
  jose:
    github: aloli-crystal/jose
  password-policy:
    github: aloli-crystal/password-policy
  pdf:
    github: aloli-crystal/pdf
  pdf-a:
    github: aloli-crystal/pdf-a
  pdf-validate:
    github: aloli-crystal/pdf-validate
  saml:
    github: aloli-crystal/saml
  totp:
    github: aloli-crystal/totp
  webauthn:
    github: aloli-crystal/webauthn
