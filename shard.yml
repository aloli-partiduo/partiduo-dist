name: partiduo-dist
version: 0.1.19

description: |
  Distribution de production de Partiduo : le cœur, l'interface Bulma et
  toutes les extensions composés en une seule application, avec le
  convertisseur PDF de l'extension MODELES. Source du paquet FreeBSD
  partiduo-app (dépôt de ports aloli-ports, publié sur pkg.aloli.net) :
  shard.lock fixe les commits exacts qu'il construit.

authors:
  - Philippe Nénert <it+claude.ai@aloli.fr>

crystal: ">= 1.19.1"

license: AGPL-3.0-or-later

targets:
  # Serveur HTTP d'une instance.
  partiduo-server:
    main: src/server.cr
  # Ligne de commande Marten (migrate, provision, collectassets…).
  partiduo-manage:
    main: manage.cr
  # Dossiers locaux, sans serveur : pilote partiduo-manage et
  # partiduo-server, sans charger l'application.
  partiduo:
    main: src/local.cr
  # Convertisseur PDF de MODELES, lancé en processus séparé par le serveur
  # (partiduo-modeles, D-MOD-017).
  partiduo-modeles-pdf:
    main: lib/partiduo-modeles/src/partiduo-modeles/pdf.cr

# Toutes depuis GitHub (dépôts publics aloli-crystal) : shard.lock en retient
# le commit. Branche development de partiduo-dist : les dépôts partiduo-*
# suivent leur branche development (paquet partiduo-app-devel) ; la branche
# production de partiduo-dist les suivra sur production (paquet
# partiduo-app). Les shards maison suivent leur branche par défaut,
# production. Tous les dépôts déclarent leurs dépendances sur GitHub :
# shard.lock ne contient aucun path: (exigence du port FreeBSD).
dependencies:
  # Le cœur : registre, événements et contrat Partiduo::Api.
  partiduo:
    github: aloli-partiduo/partiduo-app
    branch: development
  # L'interface Bulma, qui monte les interfaces des extensions.
  partiduo-ui-bulma:
    github: aloli-partiduo/partiduo-ui-bulma
    branch: development
  # Extensions, activées ou non par instance (PARTIDUO_MODULES).
  partiduo-document:
    github: aloli-partiduo/partiduo-document
    branch: development
  partiduo-einvoicing:
    github: aloli-partiduo/partiduo-einvoicing
    branch: development
  partiduo-superpdp:
    github: aloli-partiduo/partiduo-superpdp
    branch: development
  partiduo-esalink:
    github: aloli-partiduo/partiduo-esalink
    branch: development
  partiduo-choruspro:
    github: aloli-partiduo/partiduo-choruspro
    branch: development
  partiduo-teledec:
    github: aloli-partiduo/partiduo-teledec
    branch: development
  partiduo-urssaf:
    github: aloli-partiduo/partiduo-urssaf
    branch: development
  partiduo-crm:
    github: aloli-partiduo/partiduo-crm
    branch: development
  partiduo-modeles:
    github: aloli-partiduo/partiduo-modeles
    branch: development
  # Import des relevés bancaires (ADR-011 D6) ; dépôt à publier.
  partiduo-bankimport:
    github: aloli-partiduo/partiduo-bankimport
    branch: development
  # Finances personnelles d'un foyer (ADR-011), sur l'import des relevés ;
  # dépôt à publier.
  partiduo-perso:
    github: aloli-partiduo/partiduo-perso
    branch: development
  # Immobilisations et amortissements (ADR-003) ; dépôt à publier.
  partiduo-amortis:
    github: aloli-partiduo/partiduo-amortis
    branch: development
  # Paiements SEPA : virements et prélèvements (ADR-003) ; dépôt à publier.
  partiduo-sepa:
    github: aloli-partiduo/partiduo-sepa
    branch: development
  # Rapports avancés et listings (ADR-003) ; dépôt à publier.
  partiduo-reports:
    github: aloli-partiduo/partiduo-reports
    branch: development
  # Import d'opérations en masse : CSV et FEC (ADR-003) ; dépôt à publier.
  partiduo-import:
    github: aloli-partiduo/partiduo-import
    branch: development
  # Formulaires publics par jeton (ADR-003) ; dépôt à publier.
  partiduo-form:
    github: aloli-partiduo/partiduo-form
    branch: development
  # Format des sauvegardes (commande partiduo : dossiers locaux), le même que
  # sur les serveurs.
  partiduo-backup:
    github: aloli-partiduo/partiduo-backup
    branch: development
  marten:
    github: aloli-crystal/marten
    branch: production
